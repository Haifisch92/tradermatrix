<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Panel Config</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-brown: #473925; /* Marrone */
            --primary-brown-hover: #594C3A;
            --text-color: #eeeeee;
            --accent-color: #393e46;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Header personalizzato */
        .header-title {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-brown);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dot { color: white; }

        .section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-left: 4px solid var(--primary-brown);
        }

        h2 { font-size: 1.1rem; margin-top: 0; color: var(--primary-brown); text-transform: uppercase; }

        .input-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #aaa; }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--accent-color);
            background: #252a34;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--primary-brown); }

        /* Toggle Button */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary-brown); }
        input:checked + .slider:before { transform: translateX(26px); }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Pulsante Marrone */
        .btn-save {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-brown);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .btn-save:hover { background-color: var(--primary-brown-hover); }
        .btn-save:active { transform: scale(0.98); }

    </style>
</head>
<body>

<div class="container">
    <div class="header-title">TRADING <span class="dot">•</span> PANEL</div>
<div class="section">
        <div class="flex-row">
            <h2>WiFi Connection</h2>
            <label class="switch">
                <input type="checkbox" id="wifi_toggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="input-group">
            <label>SSID (Nome Rete)</label>
            <input type="text" id="wifi_ssid" placeholder="Inserisci SSID">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="wifi_pass" placeholder="Inserisci Password">
        </div>
        <div class="input-group">
            <label>Static IP (opzionale)</label>
            <input type="text" id="wifi_ip" placeholder="192.168.1.100">
        </div>
    </div>

    <div class="section">
        <h2>Orologio</h2>
        <div class="input-group">
            <label>Data</label>
            <input type="date" id="clock_date">
        </div>
        <div class="input-group">
            <label>Ora</label>
            <input type="time" id="clock_time">
        </div>
        <div class="input-group">
            <label>Design Interfaccia</label>
            <select id="clock_design">
                <option value="1">Modern Digital</option>
                <option value="2">Minimalist Dots</option>
                <option value="3">Classic Segments</option>
            </select>
        </div>
    </div>

    <div class="section">
        <h2>Brand & Loghi</h2>
        <div class="input-group">
            <label>Logo Matrice</label>
            <select id="logo_select">
                <option value="logo_1">Bitcoin Symbol</option>
                <option value="logo_2">Ethereum Symbol</option>
                <option value="logo_3">Custom Icon</option>
            </select>
        </div>
    </div>

    <div class="section">
        <h2>Trading Data</h2>
        <div class="input-group">
            <label>API Key</label>
            <input type="password" id="api_key">
        </div>
        <div class="input-group">
            <label>End Point</label>
            <input type="text" id="endpoint" placeholder="api.binance.com/...">
        </div>
        <div class="input-group">
            <label>Asset</label>
            <input type="text" id="asset" placeholder="BTC/USDT">
        </div>
        <div class="input-group">
            <label>Visualizzazione</label>
            <select id="trading_mode">
                <option value="v1">Prezzo Real-Time</option>
                <option value="v2">Candlestick Pattern</option>
            </select>
        </div>
    </div>

    <button class="btn-save" onclick="saveData()">SALVA CONFIGURAZIONE</button>
</div>

<script>

    function saveData() {
        const payload = {
            wifi: {
                enabled: document.getElementById('wifi_toggle').checked,
                ssid: document.getElementById('wifi_ssid').value,
                password: document.getElementById('wifi_pass').value,
                ip: document.getElementById('wifi_ip').value
            },
            clock: {
                date: document.getElementById('clock_date').value,
                time: document.getElementById('clock_time').value,
                design: document.getElementById('clock_design').value
            },
            logo: document.getElementById('logo_select').value,
            trading: {
                key: document.getElementById('api_key').value,
                url: document.getElementById('endpoint').value,
                asset: document.getElementById('asset').value,
                mode: document.getElementById('trading_mode').value
            }
        };

        console.log("Inviando dati all'ESP32:", payload);
        alert("Configurazione TRADING • PANEL inviata con successo!");
        
        // Esempio chiamata AJAX:
        const backend_url = document.location.origin
        const url = `${backend_url}/submit`;
        
        fetch(url, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: {'Content-Type': 'application/json'}
        });
    }
</script>
</body>
</html>
